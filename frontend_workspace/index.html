<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/workspace/kata_icon.png" />
    <link rel="icon" type="image/png" href="/kata_icon.png" />
    <link rel="shortcut icon" type="image/png" href="/workspace/kata_icon.png" />
    <link rel="apple-touch-icon" href="/workspace/kata_icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cuprum:wght@400;600;700&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kata | BICS Portal</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cuprum:wght@400;600;700&family=PT+Sans+Narrow:wght@400;700&display=swap');
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: Verdana, "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #222222;
        font-size: 12px;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: #315682;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
        color: #1a365d;
      }
      .kata-nav-link {
        font-family: 'Cuprum', "Arial Narrow", sans-serif;
        font-size: 15px;
        font-weight: 400;
        color: #222222;
        text-decoration: none !important;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        display: inline-flex;
        align-items: center;
        height: 38px;
        padding: 0 4px;
        box-sizing: border-box;
        line-height: normal;
        position: relative;
        transition: color 0.15s ease;
      }
      .kata-nav-link:hover {
        color: #000000;
        text-decoration: none !important;
      }
      .kata-nav-link.active {
        color: #000000;
        text-decoration: none !important;
        font-weight: 700;
      }
      .kata-nav-indicator {
        position: absolute;
        bottom: 4px;
        height: 2px;
        background-color: #315682;
        border-radius: 1px;
        pointer-events: none;
        transition: left 0.7s cubic-bezier(0.25, 1, 0.35, 1), width 0.7s cubic-bezier(0.25, 1, 0.35, 1), opacity 0.25s ease;
        z-index: 2;
      }
      button {
        font-family: Verdana, "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 12px;
        color: #000000;
        background: linear-gradient(to bottom, #ffffff 0%, #ebebeb 100%);
        border: 1px solid #767676;
        border-radius: 2px;
        padding: 3px 14px;
        cursor: pointer;
        box-shadow: inset 0 1px 0 #ffffff, 0 1px 2px rgba(0, 0, 0, 0.06);
        line-height: normal;
        outline: none;
      }
      button:hover:not(:disabled) {
        background: linear-gradient(to bottom, #f5f5f5 0%, #dedede 100%);
        border-color: #555555;
      }
      button:active:not(:disabled) {
        background: #e2e2e2;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.15);
      }
      button:disabled {
        background: #f4f4f4 !important;
        color: #888888 !important;
        border-color: #cccccc !important;
        cursor: not-allowed !important;
        box-shadow: none !important;
      }
      /* Global Uncopyable Protection */
      html, body, *:not(input):not(textarea) {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        // Enforce strict uncopyable protections across the entire website
        document.addEventListener('copy', function(e) {
          e.preventDefault();
          if (e.clipboardData) e.clipboardData.clearData();
          return false;
        }, true);

        document.addEventListener('cut', function(e) {
          e.preventDefault();
          if (e.clipboardData) e.clipboardData.clearData();
          return false;
        }, true);


        document.addEventListener('selectstart', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) {
            return true;
          }
          e.preventDefault();
          return false;
        }, true);

        document.addEventListener('dragstart', function(e) {
          e.preventDefault();
          return false;
        }, true);

        document.addEventListener('keydown', function(e) {
          // Block Ctrl+C, Cmd+C (Copy)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
            e.preventDefault();
            return false;
          }
          // Block Ctrl+X, Cmd+X (Cut)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'x' || e.key === 'X')) {
            e.preventDefault();
            return false;
          }
          // Block Ctrl+U, Cmd+U (View Source)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
            e.preventDefault();
            return false;
          }
          // Block Ctrl+S, Cmd+S (Save Page)
          if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
            e.preventDefault();
            return false;
          }
          // Block Ctrl+P, Cmd+P (Print Page)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
            e.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
