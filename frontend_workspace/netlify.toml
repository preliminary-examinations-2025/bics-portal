[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Static assets rewrite from /workspace/ to root assets
[[redirects]]
  from = "/workspace/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/workspace/favicon.ico"
  to = "/favicon.ico"
  status = 200

[[redirects]]
  from = "/workspace/kata_icon.png"
  to = "/kata_icon.png"
  status = 200

[[redirects]]
  from = "/workspace/kata_logo.png"
  to = "/kata_logo.png"
  status = 200

# Proxy API requests to backend server on Render
[[redirects]]
  from = "/api/*"
  to = "https://bics-portal.onrender.com/api/:splat"
  status = 200
  force = true

# Root URL redirect to /workspace/kata
[[redirects]]
  from = "/"
  to = "/workspace/kata"
  status = 302

# SPA client-side routing fallback for /workspace/*
[[redirects]]
  from = "/workspace/*"
  to = "/index.html"
  status = 200

# General SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
