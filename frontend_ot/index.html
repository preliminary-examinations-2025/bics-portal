<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bics_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BICS Terminal</title>
    <!-- Google Ecosystem & Modern UI Fonts (Plus Jakarta Sans, Inter, Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- KaTeX math rendering assets -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- TensorFlow.js and BlazeFace pre-trained model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
    <!-- Global Uncopyable Protection -->
    <style>
      html, body, *:not(input):not(textarea) {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        // Enforce strict uncopyable protections across the entire website
        document.addEventListener('copy', function(e) {
          e.preventDefault();
          if (e.clipboardData) e.clipboardData.clearData();
          return false;
        }, true);

        document.addEventListener('cut', function(e) {
          e.preventDefault();
          if (e.clipboardData) e.clipboardData.clearData();
          return false;
        }, true);

        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        }, true);

        document.addEventListener('selectstart', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) {
            return true;
          }
          e.preventDefault();
          return false;
        }, true);

        document.addEventListener('dragstart', function(e) {
          e.preventDefault();
          return false;
        }, true);

        document.addEventListener('keydown', function(e) {
          // Block Ctrl+C, Cmd+C (Copy)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
            e.preventDefault();
            return false;
          }
          // Block Ctrl+X, Cmd+X (Cut)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'x' || e.key === 'X')) {
            e.preventDefault();
            return false;
          }
          // Block Ctrl+U, Cmd+U (View Source)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
            e.preventDefault();
            return false;
          }
          // Block Ctrl+S, Cmd+S (Save Page)
          if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
            e.preventDefault();
            return false;
          }
          // Block Ctrl+P, Cmd+P (Print Page)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
            e.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
